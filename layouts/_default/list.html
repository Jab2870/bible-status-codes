<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP Bible</title>
    <meta property="og:title" content="HTTP Bible">
    <meta property="og:description" content="Bible verses for every HTTP status code (BSB translation)">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="HTTP Bible">
    <meta name="twitter:description" content="Bible verses for every HTTP status code (BSB translation)">
    <link rel="stylesheet" href="{{ "css/styles.css" | relURL }}">
</head>
<body>
    {{ .Content }}

<ul class="status-list">
    {{ range where .Site.RegularPages "Section" "code" }}
    <li>
        <a href="{{ .RelPermalink }}">
            <span class="code">{{ .Params.code }}</span>
            <span class="message-list">{{ .Params.message }}</span>
            {{ $firstVerse := index .Params.verses 0 }}
            {{ if $firstVerse }}
                <span class="verse-preview">"{{ $firstVerse.text }}"</span>
            {{ else }}
                <span class="contribute"><a href="{{ "contributing" | relURL }}">Contribute</a></span>
            {{ end }}
        </a>
    </li>
    {{ end }}
</ul>
</body>
</html>
