<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP Bible</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            line-height: 1.6;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
        }
        .status-list {
            list-style: none;
            padding: 0;
        }
        .status-list li {
            margin-bottom: 1rem;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 4px;
        }
        .status-list a {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .status-list a:hover {
            background: #eee;
        }
        .code {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .message {
            color: #666;
        }
    </style>
</head>
<body>
    <h1>HTTP Bible</h1>
    <p class="subtitle">Bible verses for every HTTP status code (BSB translation)</p>
    
    <ul class="status-list">
        {{ range .Site.RegularPages }}
        <li>
            <a href="{{ .RelPermalink }}">
                <span class="code">{{ .Params.code }}</span>
                <span class="message">{{ .Params.message }}</span>
            </a>
        </li>
        {{ end }}
    </ul>
</body>
</html>
