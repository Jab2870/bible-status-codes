<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | HTTP Bible</title>
    <meta property="og:title" content="{{ .Title }} | HTTP Bible">
    <meta property="og:description" content="{{ .Summary }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:type" content="article">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ .Title }} | HTTP Bible">
    <meta name="twitter:description" content="{{ .Summary }}">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            line-height: 1.6;
        }
        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 1rem;
        }
        h2, h3, h4, h5, h6 {
            color: #333;
            margin-top: 2rem;
        }
        p {
            margin-bottom: 1rem;
        }
        a {
            color: #0066cc;
        }
        ul, ol {
            margin-bottom: 1rem;
            padding-left: 2rem;
        }
        li {
            margin-bottom: 0.5rem;
        }
        blockquote {
            border-left: 4px solid #ccc;
            padding-left: 1rem;
            margin-left: 0;
            color: #666;
        }
        hr {
            border: none;
            border-top: 1px solid #ccc;
            margin: 2rem 0;
        }
        .back-link {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <h1>{{ .Title }}</h1>
    
    {{ .Content }}
    
    <p class="back-link">
        <a href="..">← Back to HTTP Bible</a>
    </p>
</body>
</html>
