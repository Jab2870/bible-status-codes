<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | HTTP Bible</title>
    <meta property="og:title" content="{{ .Title }} | HTTP Bible">
    <meta property="og:description" content="{{ .Summary }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:type" content="article">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ .Title }} | HTTP Bible">
    <meta name="twitter:description" content="{{ .Summary }}">
    <link rel="stylesheet" href="{{ "css/styles.css" | relURL }}">
</head>
<body>
    {{ $hasH1 := or (strings.HasPrefix .Content "<h1") (strings.Contains .Content "<h1") }}
    {{ if not $hasH1 }}
    <h1>{{ .Title }}</h1>
    {{ end }}
    
    {{ .Content }}
    
    <p class="back-link">
        <a href="..">← Back to HTTP Bible</a>
    </p>
</body>
</html>
